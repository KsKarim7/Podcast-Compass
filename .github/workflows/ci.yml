name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The provider is faked in every test, so this needs no API key and makes no
      # network calls. The two live tests skip themselves unless RUN_LIVE_TESTS=1.
      - name: Test
        run: python -m pytest -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so a key committed and later deleted is still found.
          fetch-depth: 0

      - name: Scan every commit with gitleaks
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose /repo

  image:
    name: Build and start the image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: podcast-compass:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds can still produce an image that crashes on start, so the
      # container is run and its health endpoint polled, with no API key.
      - name: Start the container and wait for the health endpoint
        run: |
          docker run -d --name app -p 8501:8501 podcast-compass:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

  deploy:
    name: Deploy to AWS
    needs: [test, secret-scan, image]
    # Only pushes to main deploy, and only once the AWS side exists (docs/AWS_SETUP.md
    # ends by setting AWS_ROLE_ARN). Pull requests and other branches stop at the build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency: deploy-production
    permissions:
      contents: read
      # Lets the job request a short-lived OIDC token, which AWS exchanges for
      # temporary credentials. No AWS keys are stored in GitHub.
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      KEY_PARAMETER: ${{ vars.GEMINI_KEY_PARAMETER }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push to ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha

      - name: Run the deploy script on the instance through SSM
        id: send
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          # The script's lines become the command list; the three values it needs go in
          # first. The API key is not among them: the instance reads it itself.
          jq -n --rawfile script deploy/ec2-deploy.sh \
            --arg image "$IMAGE" --arg region "$AWS_REGION" --arg param "$KEY_PARAMETER" \
            '{commands: (["export IMAGE=\($image) AWS_REGION=\($region) KEY_PARAMETER=\($param)"]
                         + ($script | split("\n")))}' > params.json
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the deploy script to finish
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          test "$status" = Success

      - name: Smoke test the public health endpoint
        run: |
          host=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://$host/_stcore/health"; then
              echo
              echo "Deployed ${GITHUB_SHA::7} and healthy at http://$host"
              exit 0
            fi
            sleep 5
          done
          echo "http://$host/_stcore/health did not answer within 150 seconds"
          exit 1
