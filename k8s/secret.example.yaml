# An example only: never put a real key in a file under version control.
# `make secret` creates the real Secret from your git-ignored .env file instead:
#   kubectl create secret generic gemini --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: gemini
type: Opaque
stringData:
  GEMINI_API_KEY: your-key-here
