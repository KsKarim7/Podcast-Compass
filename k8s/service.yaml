apiVersion: v1
kind: Service
metadata:
  name: podcast-compass
spec:
  type: NodePort
  selector:
    app: podcast-compass
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
  # Streamlit keeps each visitor's state (the transcript, the result, quiz answers) in the
  # memory of the pod that served the page, and talks to the browser over a WebSocket.
  # If a reconnect or a new request landed on the other pod, that pod would have no
  # session for it and the visitor would see a fresh, empty app. ClientIP affinity sends
  # every request from one client address to the same pod.
  #
  # Caveat: in kind, all browsers on your machine reach the Service from the same Docker
  # address, so they are all pinned to one pod. Affinity also cannot save a session when
  # its pod is deleted or replaced; the browser reconnects to the other pod and starts
  # again.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
